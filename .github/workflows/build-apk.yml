name: Build SecNote APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build SecNote 1.4.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "ERROR: command failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "$status"' ERR
          SETTINGS_FILE="$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "ERROR: settings.gradle.kts was not found. Upload the contents of the SecNote project folder to the repository root."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Verify project files and application identity
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "ERROR: command failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})" >&2; exit "$status"' ERR
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$BUILD_FILE"
          test -f "$PROJECT_DIR/signing/secure-notes-debug.keystore"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/PanicCredential.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/HiddenVault.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/NoteSaveQueue.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/StorageGate.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/Vault.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/ThumbnailDecodePolicy.kt"
          test -f "$PROJECT_DIR/app/src/main/java/infernics/notes/AutoLockPolicy.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/PanicCredentialTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/NoteOrderingTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/AutoLockPolicyTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/HiddenVaultTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/ThumbnailDecodePolicyTest.kt"
          test -f "$PROJECT_DIR/app/src/test/java/infernics/notes/CryptoTest.kt"
          grep -Fq 'persistedVerifierDoesNotContainThePassphrase' "$PROJECT_DIR/app/src/test/java/infernics/notes/HiddenVaultTest.kt"
          grep -Fq 'internal fun createRecord' "$PROJECT_DIR/app/src/main/java/infernics/notes/PanicCredential.kt"
          grep -Fq 'internal fun verifyRecord' "$PROJECT_DIR/app/src/main/java/infernics/notes/PanicCredential.kt"
          grep -Fq 'applicationId = "infernics.notes"' "$BUILD_FILE"
          grep -Fq 'compileSdk = 35' "$BUILD_FILE"
          grep -Fq 'id("com.android.application") version "8.6.1" apply false' "$PROJECT_DIR/build.gradle.kts"
          grep -Fq 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-core:1.5.3' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-camera2:1.5.3' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-lifecycle:1.5.3' "$BUILD_FILE"
          grep -Fq 'androidx.camera:camera-view:1.5.3' "$BUILD_FILE"
          grep -Fq 'namespace = "infernics.notes"' "$BUILD_FILE"
          grep -Fq 'versionCode = 18' "$BUILD_FILE"
          grep -Fq 'versionName = "1.4.10"' "$BUILD_FILE"
          grep -Fq 'SecNoteVaultSaltKey' "$PROJECT_DIR/app/src/main/java/infernics/notes/Vault.kt"
          grep -Fq 'StorageGate.blockAndDrain()' "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          grep -Fq 'Crypto.destroyAll()' "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          grep -Fq 'getExternalFilesDirs(null)' "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          grep -Fq 'HiddenVault.DIRECTORY_NAME' "$PROJECT_DIR/app/src/main/java/infernics/notes/EmergencyWipe.kt"
          grep -Fq 'IdentityHashMap<Crypto, Boolean>' "$PROJECT_DIR/app/src/main/java/infernics/notes/Crypto.kt"
          grep -Fq 'fun matchesPassphrase' "$PROJECT_DIR/app/src/main/java/infernics/notes/HiddenVault.kt"
          grep -Fq 'fun unlockFromRecord' "$PROJECT_DIR/app/src/main/java/infernics/notes/HiddenVault.kt"
          grep -Fq 'createTempFile("$cachePrefix-export-' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'cleanupAbandonedTemporaryFiles(this)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'hiddenVaultConfigured = false' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'lockCleanupPending = lockCleanupPending' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'lockCleanupPending: Boolean' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'val sessionKey = hiddenCrypto' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'onDispose { sessionKey?.destroy() }' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'detectTapGestures(' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'longPressTimeoutMillis: Long = 5_000L' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'onLongPress = { hiddenVaultCallback() }' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'onTap = { lockCallback() }' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          ! grep -Fq 'withTimeoutOrNull(5_000L)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'storageDirectoryName = HiddenVault.DIRECTORY_NAME' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          ! grep -Eiq 'BiometricVault|BIOMETRIC|AndroidKeyStore' "$PROJECT_DIR/app/src/main/java/infernics/notes/HiddenVault.kt"
          grep -Fq 'delay(4_000)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'limitedParallelism(1)' "$PROJECT_DIR/app/src/main/java/infernics/notes/NoteSaveQueue.kt"
          grep -Fq 'suspend fun awaitIdle()' "$PROJECT_DIR/app/src/main/java/infernics/notes/NoteSaveQueue.kt"
          grep -Fq 'StorageGate.resumeAfterUnlock()' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'StorageGate.resumeAfterNewVault()' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'StorageGate.withAccess(generation)' "$PROJECT_DIR/app/src/main/java/infernics/notes/HiddenVault.kt"
          grep -Fq 'NoteSaveQueue.awaitIdle()' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'fun reorder(' "$PROJECT_DIR/app/src/main/java/infernics/notes/NoteRepository.kt"
          grep -Fq 'getAutoLockMinutes' "$PROJECT_DIR/app/src/main/java/infernics/notes/AppPreferences.kt"
          grep -Fq 'supportedMinutes' "$PROJECT_DIR/app/src/main/java/infernics/notes/AppPreferences.kt"
          grep -Fq 'setOf(-1, 0, 1, 5, 10, 15, 30)' "$PROJECT_DIR/app/src/main/java/infernics/notes/AutoLockPolicy.kt"
          grep -Fq 'shouldLockImmediately(autoLockMinutes)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'autoLockMinutes > 0' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'Никогда' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'onBiometricUnlock { errorMessage = it }' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'Нажмите на замок для входа по биометрии' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'swapNotePositions' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'internal fun swapNotePositions' "$PROJECT_DIR/app/src/main/java/infernics/notes/NoteRepository.kt"
          ! grep -Fq 'Войти по отпечатку' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'overwriteAndDelete' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'bestEffortOverwriteSource' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'fun importManyAndRemoveOriginal' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'private fun selectedDocumentUris' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'preserveSessionOnTemporaryUiReturn' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'android.permission.CAMERA' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -Fq 'fun saveCapturedPhoto' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'OnImageCapturedCallback' "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          grep -Fq 'CameraJpegEncoder.toUprightJpeg' "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          grep -Fq 'storageDirectoryName: String = "file_vault"' "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          grep -Fq 'FileVaultRepository(context, crypto, storageDirectoryName)' "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          grep -Fq 'storageDirectoryName = HiddenVault.DIRECTORY_NAME' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'onOpenCamera = { cameraVisible = true }' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'SmallFloatingActionButton(onClick = onOpenCamera)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'ThumbnailDecodePolicy.sampleSize(width, height, maxDimension)' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'inPreferredConfig = Bitmap.Config.RGB_565' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          grep -Fq 'catch (_: OutOfMemoryError)' "$PROJECT_DIR/app/src/main/java/infernics/notes/FileVaultRepository.kt"
          ! grep -Fq 'DisposableEffect(thumbnail)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          ! grep -Fq 'DisposableEffect(bitmap)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          ! grep -Fq 'bitmap.recycle()' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'previewLoadFinished' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'cameraSizedPhotoIsDecodedWithBoundedSampling' "$PROJECT_DIR/app/src/test/java/infernics/notes/ThumbnailDecodePolicyTest.kt"
          grep -Fq 'jpegPayloadSurvivesVaultStreamingEncryption' "$PROJECT_DIR/app/src/test/java/infernics/notes/CryptoTest.kt"
          ! grep -Fq 'IconButton(onClick = onOpenCamera)' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          ! grep -Fq 'ImageCapture.OutputFileOptions' "$PROJECT_DIR/app/src/main/java/infernics/notes/CameraCaptureScreen.kt"
          ! grep -Fq 'lockAfterPicker' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          ! grep -Fq 'Переместить файл в защищённое хранилище?' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'selected = !darkTheme' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'selected = darkTheme' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          grep -Fq 'FlowRow(' "$PROJECT_DIR/app/src/main/java/infernics/notes/MainActivity.kt"
          echo "Verified: infernics.notes, SecNote 1.4.10 (code 18), independent password-derived encrypted file area, session-only hidden key, no hidden-key biometric route, global emergency destruction and legacy features"

      - name: Run unit tests and build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
